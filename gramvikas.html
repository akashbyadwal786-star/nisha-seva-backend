<!DOCTYPE html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GramVikas Intelligence | NSF</title><style>body{font-family:system-ui;background:#f4f6fb;color:#1c2d46;margin:0;padding:20px}.wrap{max-width:1000px;margin:auto}section,.village{background:white;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 5px 20px #0001}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccd5e3;border-radius:8px}button{background:#225b9c;color:white;padding:12px;border:0;border-radius:8px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}</style><div class="wrap"><h1>🏘️ GramVikas Intelligence</h1><p>गांवों की जानकारी, सामुदायिक सुझाव और विकास कार्यों की सार्वजनिक प्रगति।</p><section><h2>गांव का प्रोफाइल सुझाव</h2><form id="v"><input name="village" placeholder="गांव" required><input name="district" placeholder="जिला" required><input name="block" placeholder="ब्लॉक"><input name="population" placeholder="अनुमानित जनसंख्या (optional)"><textarea name="description" placeholder="गांव के बारे में विवरण"></textarea><button>Submit Village</button></form><p id="vm"></p></section><section><h2>विकास कार्य / समस्या / सुझाव जोड़ें</h2><form id="i"><select name="village_id" id="vid" required><option value="">पहले गांव चुनें</option></select><select name="type"><option>Development Project</option><option>Community Issue</option><option>Suggestion</option><option>Resource</option></select><input name="title" placeholder="शीर्षक" required><textarea name="details" placeholder="विवरण"></textarea><input name="budget" placeholder="बजट/संसाधन (optional)"><button>Submit Item</button></form><p id="im"></p></section><section><h2>Village Profiles & Progress</h2><div id="data">Loading...</div></section><p><a href="/">NSF Home</a> · <a href="/jansamadhan">JanSamadhan</a> · <a href="/seva-connect">SevaConnect</a></p></div><script>async function load(){try{let d=await fetch('/api/gramvikas').then(r=>r.json());let sel=document.getElementById('vid');sel.innerHTML='<option value="">Select Village</option>'+(d.villages||[]).map(v=>`<option value="${v.id}">${v.village}, ${v.district}</option>`).join('');document.getElementById('data').innerHTML='<div class="grid">'+(d.villages||[]).map(v=>`<div class="village"><h3>${v.village}</h3><b>${v.district}</b><p>${v.block||''} ${v.population?'· Population '+v.population:''}</p>${v.description||''}</div>`).join('')+'</div><h3>Recent items</h3>'+(d.items||[]).map(x=>`<div class="village"><b>${x.title}</b> · ${x.type} · ${x.village}, ${x.district}<p>${x.details||''}</p><p>Status: ${x.status} · Progress: ${x.progress}%</p></div>`).join('')}catch{document.getElementById('data').textContent='Data unavailable'}}document.getElementById('v').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/gramvikas/village',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();document.getElementById('vm').textContent=r.ok?'Village submitted; admin review may be required.':j.error;load()};document.getElementById('i').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/gramvikas/item',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();document.getElementById('im').textContent=r.ok?'Submitted successfully.':j.error;e.target.reset();load()};load()</script></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Verification | Nisha Seva Foundation</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f8;color:#173044;font-family:Arial,sans-serif}.top{background:#09243a;color:#fff;padding:22px;text-align:center;border-bottom:5px solid #efb331}.wrap{max-width:720px;margin:28px auto;padding:0 15px}.card{background:#fff;border:1px solid #dce5ea;border-radius:18px;padding:22px;box-shadow:0 12px 35px #09243a12}.person{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.photo{width:112px;height:132px;object-fit:cover;border-radius:12px;border:2px solid #e8b23c;background:#edf2f4}.badge{display:inline-block;padding:6px 11px;border-radius:30px;background:#e4f5eb;color:#17633f;font-weight:bold;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.item{background:#f6f9fa;padding:12px;border-radius:10px;overflow-wrap:anywhere}.item b{display:block;color:#647887;font-size:11px;margin-bottom:5px}.muted{color:#607485;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>NISHA SEVA FOUNDATION</b><div class="muted" style="color:#dbe7ed">Official Student Verification</div></header><main class="wrap"><section class="card" id="profile"><p>Loading student record…</p></section><p class="muted" style="text-align:center">This page displays limited information for identity and record verification. Private contact details and uploaded documents are not public.</p></main><script>const API=(window.NISHA_API_URL||'https://api.nishasevafoundation.org').replace(/\/$/,'');const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('profile');if(!id){box.textContent='Invalid verification link.';return;}try{const r=await fetch(API+'/api/student/verify/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.profile)throw new Error(d.error||'Student record not found.');const p=d.profile;const photo=p.photo?'<img class="photo" src="'+p.photo+'" alt="Student photo">':'<div class="photo" style="display:grid;place-items:center">No Photo</div>';const rows=[['Student ID',p.studentId],['Application ID',p.applicationId],['Student Name',p.studentName],['College',p.college],['University',p.university],['Course',p.course],['Year / Semester',p.yearSemester],['Programme',p.programme],['Internship Duration',p.duration],['Focus Areas',(p.interests||[]).join(', ')],['Internship ID',p.internshipId],['Application Status',p.applicationStatus],['Submitted On',p.submittedOn?new Date(p.submittedOn).toLocaleDateString('en-IN'):null]];box.innerHTML='<div class="person">'+photo+'<div><span class="badge">'+esc(p.verificationStatus)+'</span><h2 style="margin:10px 0 4px">'+esc(p.studentName)+'</h2><div class="muted">'+esc(p.studentId)+'</div></div></div><div class="grid">'+rows.map(([k,v])=>'<div class="item"><b>'+esc(k)+'</b>'+esc(v||'—')+'</div>').join('')+'</div><p class="muted" style="margin-top:18px">Verified against Nisha Seva Foundation internship records.</p>';}catch(e){box.innerHTML='<h2>Student record unavailable</h2><p>'+esc(e.message)+'</p>';}})();</script></body></html>

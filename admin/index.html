<style>

input,
textarea{

}

textarea{
  resize:vertical;
}

.small{

.err{

.ok{

}

<body>

<div id="app"></div>

<script>

/* =========================================================
   API
   ========================================================= */

const API = location.origin;

let token = localStorage.getItem("nisha_token") || "";
let current = "programs";
let volunteerCache = {};


/* =========================================================
   TABS
   ========================================================= */

const tabs = [
  ["programs","Programs"],
  ["events","Events"],
  ["gallery","Gallery"],
  ["documents","Documents"],
  ["donors","Donors"],
  ["volunteers","Volunteers"],
  ["members","Members"],
  ["contactMessages","Messages"],
  ["newsletter","Newsletter"]
];


/* =========================================================
   API FUNCTION
   ========================================================= */

async function api(path,opt={}){

  opt.headers = {
    "Content-Type":"application/json",
    ...(opt.headers || {})
  };

  if(token){
    opt.headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(API + path,opt);

  const text = await response.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }
  catch{
    data = {error:text};
  }

  if(!response.ok){
    throw new Error(data.error || "HTTP " + response.status);
  }

  return data;
}


/* =========================================================
   ESCAPE
   ========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];
    });

}


/* =========================================================
   LOGIN
   ========================================================= */

function login(){

  app.innerHTML = `

    <div class="wrap">

      <div class="card"
           style="max-width:420px;margin:80px auto">

        <h2>🌿 Nisha Seva Foundation</h2>

        <p>
          <b>Admin Panel Login</b>
        </p>

        <input
          id="user"
          placeholder="Username"
        >

        <br><br>

        <input
          id="pass"
          type="password"
          placeholder="Password"
        >

        <br><br>

        <button
          class="primary"
          onclick="doLogin()"
        >
          Login
        </button>

        <div id="msg"></div>

      </div>

    </div>

  `;
}


/* =========================================================
   DO LOGIN
   ========================================================= */

async function doLogin(){

  try{

    const data = await api(
      "/api/admin/login",
      {
        method:"POST",
        body:JSON.stringify({
          username:user.value,
          password:pass.value
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "nisha_token",
      token
    );

    render();

  }
  catch(error){

    msg.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  try{
    await api(
      "/api/admin/logout",
      {
        method:"POST"
      }
    );
  }
  catch{}

  localStorage.removeItem("nisha_token");

  token = "";

  login();

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

async function render(){

  if(!token){
    login();
    return;
  }

  app.innerHTML = `

    <header>

      <div>
        <b>🌿 Nisha Seva Foundation</b>
        <br>
        <small>Admin Panel</small>
      </div>

      <button
        class="muted"
        onclick="logout()"
      >
        Logout
      </button>

    </header>

    <div class="wrap">

      <div class="tabs">

        ${tabs.map(tab => `

          <button
            class="${tab[0] === current ? "active" : ""}"
            onclick="current='${tab[0]}';render()"
          >
            ${tab[1]}
          </button>

        `).join("")}

      </div>

      <div
        class="card"
        id="content"
      >
        Loading...
      </div>

    </div>

  `;


  try{

    if(current === "volunteers"){

      await renderVolunteers();

      return;

    }


    const data = await api(
      "/api/" + current
    );

    const records =
      Array.isArray(data)
        ? data
        : [];


    let html = `

      <div class="row">

        <div>

          <h2>
            ${esc(
              tabs.find(x => x[0] === current)[1]
            )}
          </h2>

          <span class="small">
            ${records.length} record(s)
          </span>

        </div>

        ${
          [
            "programs",
            "events",
            "gallery",
            "documents",
            "donors"
          ].includes(current)
          ?
          `<button
             class="primary"
             onclick="editor()"
           >
             + Add
           </button>`
          :
          ""
        }

      </div>

    `;


    if(records.length){

      html += records
        .map(card)
        .join("");

    }
    else{

      html += `
        <p>
          No records yet.
        </p>
      `;

    }


    content.innerHTML = html;

  }
  catch(error){

    content.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   NORMAL CARD
   ========================================================= */

function card(x){

  const title =
    x.title ||
    x.name ||
    x.subject ||
    x.email ||
    ("Record #" + x.id);


  return `

    <div class="item">

      <div class="row">

        <b>
          ${esc(title)}
        </b>

        <div class="actions">

          <button
            class="muted"
            onclick='editor(${JSON.stringify(x).replace(/'/g,"&#39;")})'
          >
            Edit
          </button>

          <button
            class="danger"
            onclick="del(${x.id})"
          >
            Delete
          </button>

        </div>

      </div>

      <div class="small">
        ID: ${esc(x.id)}
      </div>

      <pre>${esc(JSON.stringify(x,null,2))}</pre>

    </div>

  `;

}


/* =========================================================
   NORMAL EDITOR
   ========================================================= */

function editor(x){

  x = x || {
    title:"",
    description:""
  };


  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>Record</h2>

        <textarea
          id="json"
          rows="18"
        >${esc(JSON.stringify(x,null,2))}</textarea>

        <div id="em"></div>

        <br>

        <div class="row">

          <button
            class="muted"
            onclick="modal.remove()"
          >
            Cancel
          </button>

          <button
            class="primary"
            onclick="save(${x.id === undefined ? "null" : x.id})"
          >
            Save
          </button>

        </div>

      </div>

    </div>

    `
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function save(id){

  try{

    const obj =
      JSON.parse(json.value);

    delete obj.id;

    await api(

      id === null
        ? "/api/" + current
        : "/api/" + current + "/" + id,

      {
        method:
          id === null
            ? "POST"
            : "PUT",

        body:JSON.stringify(obj)
      }

    );

    modal.remove();

    render();

  }
  catch(error){

    em.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   DELETE
   ========================================================= */

async function del(id){

  if(!confirm("Delete this record?")){
    return;
  }

  try{

    await api(
      "/api/" + current + "/" + id,
      {
        method:"DELETE"
      }
    );

    render();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   VOLUNTEERS
   ========================================================= */

async function renderVolunteers(){

  content.innerHTML = `
    <h2>Volunteers</h2>
    <p>Loading volunteers...</p>
  `;


  try{

    const data =
      await api("/api/volunteers");

    const volunteers =
      Array.isArray(data)
        ? data
        : [];

    volunteerCache = {};
    volunteers.forEach(v => { volunteerCache[v.id] = v; });


    let html = `

      <div class="row">

        <div>

          <h2>Volunteer Applications</h2>

          <span class="small">
            ${volunteers.length} volunteer(s)
          </span>

        </div>

      </div>

    `;


    if(!volunteers.length){

      html += `
        <div class="ok">
          अभी कोई volunteer application नहीं है।
        </div>
      `;

    }
    else{

      html += volunteers
        .map(volunteerCard)
        .join("");

    }


    content.innerHTML = html;

  }
  catch(error){

    content.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   VOLUNTEER CARD
   ========================================================= */

function volunteerCard(v){

  const status =
    String(v.status || "pending").toLowerCase();


  const statusClass =
    ["pending","active","rejected","revoked"]
      .includes(status)
      ? status
      : "pending";


  let actions = "";


  if(status === "pending"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Approve & Issue ID
      </button>

      <button
        class="danger"
        onclick="rejectVolunteer(${v.id})"
      >
        ✕ Reject
      </button>

    `;

  }


 if(status === "active"){

  actions = `

    <button
      class="primary"
      onclick="showIdCardById(${v.id})"
    >
      🪪 ID Card
    </button>

    <button
      class="muted"
      onclick="openVerification('${esc(v.verificationCode || "")}','${esc(v.verificationUrl || "")}')"
    >
      🔍 Verify
    </button>

    <button
      class="warning"
      onclick="revokeVolunteer(${v.id})"
    >
      Revoke ID
    </button>

  `;

}

  if(status === "rejected"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Approve & Issue ID
      </button>

    `;

  }


  if(status === "revoked"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Re-issue ID
      </button>

    `;

  }


  return `

    <div class="item">

      <div class="row">

        <div>

          <h3 style="margin:0 0 6px">
            ${esc(
              v.name ||
              v.fullName ||
              "Volunteer"
            )}
          </h3>

          <span
            class="status ${statusClass}"
          >
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="actions">
          ${actions}
        </div>

      </div>


      ${
        v.photoUrl
          ? `<div style="margin-top:12px;display:flex;align-items:center;gap:12px">
               <img src="${esc(v.photoUrl)}" alt="Volunteer Photo" style="width:78px;height:96px;object-fit:cover;border-radius:10px;border:2px solid #d9a441;background:#f7f9fc">
               <div class="small"><b>Volunteer Photo</b><br>Photo received with application.</div>
             </div>`
          : ""
      }

      <div class="volunteer-info">

        <div class="info-box">
          <strong>Volunteer ID</strong>
          ${esc(v.volunteerId || "Not issued")}
        </div>

        <div class="info-box">
          <strong>Database ID</strong>
          ${esc(v.id)}
        </div>

        <div class="info-box">
          <strong>Phone</strong>
          ${esc(v.phone || "-")}
        </div>

        <div class="info-box">
          <strong>Email</strong>
          ${esc(v.email || "-")}
        </div>

        <div class="info-box">
          <strong>Father's Name</strong>
          ${esc(v.fatherName || v.father || "-")}
        </div>

        <div class="info-box">
          <strong>Gender</strong>
          ${esc(v.gender || "-")}
        </div>

        <div class="info-box">
          <strong>City</strong>
          ${esc(v.city || "-")}
        </div>

        <div class="info-box">
          <strong>Area</strong>
          ${esc(v.area || "-")}
        </div>

        <div class="info-box">
          <strong>Skills</strong>
          ${esc(v.skills || "-")}
        </div>

        <div class="info-box">
          <strong>Submitted</strong>
          ${esc(
            v.submittedAt
              ? new Date(v.submittedAt).toLocaleString()
              : "-"
          )}
        </div>

      </div>


      ${
        v.message
        ?
        `<div style="margin-top:12px">
           <b>Message:</b>
           ${esc(v.message)}
         </div>`
        :
        ""
      }


      ${
        v.verificationCode
        ?
        `<div class="small" style="margin-top:10px">
           Verification Code:
           <b>${esc(v.verificationCode)}</b>
         </div>`
        :
        ""
      }

    </div>

  `;

}


/* =========================================================
   APPROVE
   ========================================================= */

async function approveVolunteer(id){

  if(!confirm("क्या आप इस volunteer को Approve करके Official ID जारी करना चाहते हैं?")){
    return;
  }

  try{

    const result = await api(
      "/api/volunteers/" + id + "/approve",
      {
        method:"POST"
      }
    );

    /*
      Backend से जो data आएगा उसे existing volunteer
      data के साथ merge किया जाएगा।
    */

    const volunteers = await api("/api/volunteers");

    const list = Array.isArray(volunteers)
      ? volunteers
      : [];

    let volunteer = list.find(
      v => Number(v.id) === Number(id)
    );

    /*
      अगर backend से volunteer वापस नहीं मिला,
      तो result का इस्तेमाल करेंगे।
    */

    if(!volunteer){

      volunteer = {
        id:id,
        ...(result || {})
      };

    }

    /*
      सुनिश्चित करें कि status ACTIVE रहे
    */

    volunteer.status = "active";

    /*
      अगर backend ने Volunteer ID नहीं भेजी,
      तो database ID से official ID बनाएंगे।
    */

    if(!volunteer.volunteerId){

      volunteer.volunteerId =
        "NSF-V-" +
        String(id).padStart(5,"0");

    }

    /*
      Verification code backend से आना चाहिए।
    */

    if(result && result.verificationCode){
      volunteer.verificationCode = result.verificationCode;
    }

    if(result && result.verificationUrl){
      volunteer.verificationUrl = result.verificationUrl;
    }


    /*
      ID Card तुरंत खोलें
    */

    showIdCard(volunteer);

    /*
      पीछे volunteer list भी refresh होगी
    */

    setTimeout(function(){

      renderVolunteers();

    },500);

  }
  catch(error){

    alert(
      "ID जारी नहीं हो सकी:\n\n" +
      error.message
    );

  }

}
/* =========================================================
   REJECT
   ========================================================= */

async function rejectVolunteer(id){

  if(
    !confirm(
      "क्या आप इस volunteer application को Reject करना चाहते हैं?"
    )
  ){
    return;
  }


  try{

    await api(
      "/api/volunteers/" + id + "/reject",
      {
        method:"POST"
      }
    );


    alert(
      "Volunteer application rejected."
    );


    renderVolunteers();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   REVOKE
   ========================================================= */

async function revokeVolunteer(id){

  if(
    !confirm(
      "क्या आप इस Volunteer ID को Revoke करना चाहते हैं?"
    )
  ){
    return;
  }


  try{

    await api(
      "/api/volunteers/" + id + "/revoke",
      {
        method:"POST"
      }
    );


    alert(
      "Volunteer ID revoked."
    );


    renderVolunteers();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   ID CARD MODAL
   ========================================================= */

function showIdCardById(id){
  const volunteer = volunteerCache[id];
  if(!volunteer){
    alert("Volunteer record नहीं मिला। कृपया list refresh करें।");
    return;
  }
  showIdCard(volunteer);
}

function showIdCard(v){

  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="idModal"
    >

      <div class="modalbox">

        <div class="row">

          <div>

            <h2 style="margin:0">
              🪪 Official Volunteer ID Card
            </h2>

            <div class="small">
              Nisha Seva Foundation
            </div>

          </div>

          <button
            class="muted"
            onclick="idModal.remove()"
          >
            ✕ Close
          </button>

        </div>


        <div class="id-preview">

          <canvas
            id="idCanvas"
            width="1200"
            height="700"
          ></canvas>

        </div>


        <div class="row">

          <button
            class="primary"
            onclick="downloadPNG()"
          >
            🖼 Download PNG
          </button>

          <button
            class="success"
            onclick="downloadPDF()"
          >
            📄 Download PDF
          </button>

          <button
            class="muted"
            onclick="openVerification('${esc(v.verificationCode || "")}','${esc(v.verificationUrl || "")}')"
          >
            🔍 Open Verification
          </button>

        </div>


        <div
          id="cardInfo"
          class="small"
          style="margin-top:15px"
        ></div>

      </div>

    </div>

    `
  );


  drawIdCard(v);

}


/* =========================================================
   DRAW ID CARD
   ========================================================= */
/* =========================================================
   DRAW ID CARD
   ========================================================= */

let currentVolunteer = null;

function drawIdCard(v){

  currentVolunteer = v;

  const canvas = document.getElementById("idCanvas");
  if(!canvas){
    alert("ID Card canvas नहीं मिला।");
    return;
  }

  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  /* ========================= DATA ========================= */
  const volunteerName = String(v.name || v.fullName || "Volunteer");

  function roundedRect(x,y,w,h,r,fill,stroke,strokeWidth=1){
    ctx.beginPath();
    if(typeof ctx.roundRect === "function") ctx.roundRect(x,y,w,h,r);
    else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); }
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=strokeWidth;ctx.stroke();}
  }

  function fitText(text,maxChars){
    text=String(text || "-");
    return text.length>maxChars ? text.slice(0,maxChars-1)+"…" : text;
  }

  function drawFlower(cx,cy,scale=1){
    ctx.save(); ctx.translate(cx,cy); ctx.globalAlpha=.28;
    for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.fillStyle="#d9a441"; ctx.beginPath(); ctx.ellipse(0,-18*scale,8*scale,18*scale,0,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle="#b46b8c"; ctx.beginPath(); ctx.arc(0,0,7*scale,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function drawLeaf(x,y,angle,scale=1){
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.globalAlpha=.20; ctx.fillStyle="#0f5132"; ctx.beginPath(); ctx.ellipse(0,0,7*scale,18*scale,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function drawFloralCorner(x,y,flipX,flipY){
    ctx.save(); ctx.translate(x,y); ctx.scale(flipX,flipY);
    drawLeaf(10,45,-.6,1.2); drawLeaf(35,20,-1.0,1); drawLeaf(65,8,-.4,.85); drawFlower(72,60,1); drawFlower(35,85,.65);
    ctx.restore();
  }

  function drawLabelValue(label,value,x,y,max=24){
    ctx.fillStyle="#718096"; ctx.font="bold 13px Arial"; ctx.fillText(label.toUpperCase(),x,y);
    ctx.fillStyle="#172033"; ctx.font="bold 19px Arial"; ctx.fillText(fitText(value,max),x,y+23);
  }

  /* ========================= PREMIUM BACKGROUND ========================= */
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#0b4d35"); bg.addColorStop(.5,"#146b49"); bg.addColorStop(1,"#0b3b2a");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawFloralCorner(18,18,1,1); drawFloralCorner(W-18,18,-1,1); drawFloralCorner(18,H-18,1,-1); drawFloralCorner(W-18,H-18,-1,-1);
  roundedRect(22,22,W-44,H-44,34,"#f8f3e7","#d9a441",5);
  roundedRect(38,38,W-76,H-76,26,"#fffdf8","#ead7a6",2);

  /* ========================= HEADER ========================= */
  roundedRect(38,38,W-76,112,26,"#0f5132",null);
  ctx.fillStyle="#f7e6b5"; ctx.font="bold 34px Georgia, serif"; ctx.fillText("NISHA SEVA FOUNDATION",78,88);
  ctx.fillStyle="#f7d889"; ctx.font="bold 15px Arial"; ctx.fillText("OFFICIAL VOLUNTEER IDENTITY CARD",80,119);
  ctx.fillStyle="#d9a441"; ctx.beginPath(); ctx.arc(W-92,94,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#0f5132"; ctx.font="bold 21px Arial"; ctx.fillText("NSF",W-112,101);

  /* ========================= PHOTO ========================= */
  const photoX=72, photoY=185, photoW=225, photoH=275;
  roundedRect(photoX-5,photoY-5,photoW+10,photoH+10,22,"#d9a441",null);
  roundedRect(photoX,photoY,photoW,photoH,18,"#e9eef6",null);

  function drawInitial(){
    roundedRect(photoX,photoY,photoW,photoH,18,"#e9eef6",null);
    ctx.fillStyle="#0f5132"; ctx.font="bold 100px Georgia, serif";
    ctx.fillText((volunteerName.charAt(0)||"V").toUpperCase(),photoX+82,photoY+170);
    ctx.fillStyle="#718096"; ctx.font="bold 14px Arial"; ctx.fillText("PHOTO",photoX+87,photoY+220);
  }

  function drawPhoto(img){
    ctx.save(); ctx.beginPath();
    if(typeof ctx.roundRect === "function") ctx.roundRect(photoX,photoY,photoW,photoH,18); else ctx.rect(photoX,photoY,photoW,photoH);
    ctx.clip();
    const scale=Math.max(photoW/img.width,photoH/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    ctx.drawImage(img,photoX+(photoW-dw)/2,photoY+(photoH-dh)/2,dw,dh);
    ctx.restore();
  }

  /* ========================= DETAILS ========================= */
  ctx.fillStyle="#8b6a20"; ctx.font="bold 14px Arial"; ctx.fillText("VOLUNTEER",335,187);
  ctx.fillStyle="#172033"; ctx.font="bold 31px Georgia, serif"; ctx.fillText(fitText(volunteerName,27),335,222);
  ctx.fillStyle="#0f5132"; ctx.font="bold 21px Arial"; ctx.fillText(volunteerId,335,258);
  roundedRect(335,276,150,38,19,"#dff3e8",null);
  ctx.fillStyle="#0f5132"; ctx.font="bold 15px Arial"; ctx.fillText("✓ ACTIVE",370,301);

  drawLabelValue("Father's Name",fatherName,335,345,25);
  drawLabelValue("Gender",gender,335,405,15);
  drawLabelValue("Age",age,490,405,8);
  drawLabelValue("City",city,335,465,22);

  /* ========================= QR ========================= */
  const qrX=875, qrY=190, qrSize=220;
  roundedRect(qrX-15,qrY-15,qrSize+30,qrSize+30,20,"#ffffff","#ead7a6",2);

  function finishQR(qrSource){
    if(qrSource) ctx.drawImage(qrSource,qrX,qrY,qrSize,qrSize);
    else { ctx.fillStyle="#f8d7da"; ctx.fillRect(qrX,qrY,qrSize,qrSize); ctx.fillStyle="#842029"; ctx.font="bold 16px Arial"; ctx.fillText("QR unavailable",qrX+43,qrY+112); }

    ctx.fillStyle="#0f5132"; ctx.font="bold 16px Arial"; ctx.textAlign="center"; ctx.fillText("SCAN TO VERIFY",qrX+qrSize/2,qrY+qrSize+48);
    ctx.fillStyle="#718096"; ctx.font="13px Arial"; ctx.fillText(verificationCode || "Verification",qrX+qrSize/2,qrY+qrSize+70); ctx.textAlign="left";

    /* ========================= BOTTOM DETAILS ========================= */
    roundedRect(72,530,750,86,18,"#f6f1e5",null);
    drawLabelValue("Phone",phone,95,548,18);
    drawLabelValue("Area",area,310,548,22);
    drawLabelValue("Gender",gender,565,548,14);

   /* ========================= GENERAL SECRETARY SIGNATURE ========================= */

};

  /* ========================= VOLUNTEER PHOTO ========================= */
  if(photoUrl){

/* =========================================================
   DOWNLOAD PNG
   ========================================================= */

function downloadPNG(){

  if(!currentVolunteer){
    return;
  }


  const canvas =
    document.getElementById(
      "idCanvas"
    );


  const name =
    (
      currentVolunteer.name ||
      currentVolunteer.fullName ||
      "volunteer"
    )
    .replace(/[^a-z0-9]/gi,"_");


  const link =
    document.createElement("a");


  link.download =
    "Nisha-Seva-Volunteer-ID-" +
    name +
    ".png";


  link.href =
    canvas.toDataURL("image/png");


  link.click();

}


/* =========================================================
   DOWNLOAD PDF
   ========================================================= */

function downloadPDF(){

  if(!currentVolunteer){
    return;
  }


  const canvas =
    document.getElementById(
      "idCanvas"
    );


  const image =
    canvas.toDataURL(
      "image/png"
    );


  const { jsPDF } =
    window.jspdf;


  const pdf =
    new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4"
    });


  const pageWidth =
    pdf.internal.pageSize.getWidth();


  const pageHeight =
    pdf.internal.pageSize.getHeight();


  const margin = 15;

  const maxWidth =
    pageWidth - margin*2;

  const maxHeight =
    pageHeight - margin*2;


  const ratio =
    canvas.width /
    canvas.height;


  let width =
    maxWidth;

  let height =
    width / ratio;


  if(height > maxHeight){

    height =
      maxHeight;

    width =
      height * ratio;

  }


  const x =
    (pageWidth-width)/2;

  const y =
    (pageHeight-height)/2;


  pdf.addImage(
    image,
    "PNG",
    x,
    y,
    width,
    height
  );


  const name =
    (
      currentVolunteer.name ||
      currentVolunteer.fullName ||
      "volunteer"
    )
    .replace(/[^a-z0-9]/gi,"_");


  pdf.save(
    "Nisha-Seva-Volunteer-ID-" +
    name +
    ".pdf"
  );

}

   ========================================================= */

function openVerification(code,url){

  const target =
    url ||
    (code
      ? API + "/verify/volunteer/" + encodeURIComponent(code)
      : "");

  if(!target){
    alert("Verification link available नहीं है।");
    return;
  }

  window.open(target,"_blank","noopener,noreferrer");
}

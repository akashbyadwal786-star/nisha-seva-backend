<body>

<div id="app"></div>

<script>

/* =========================================================
   API
   ========================================================= */

const API = (window.NISHA_API_URL || 'https://nisha-seva-backend.onrender.com').replace(/\/$/, '');

let token = localStorage.getItem("nisha_token") || "";
let current = "programs";
let volunteerCache = {};


/* =========================================================
   TABS
   ========================================================= */

const tabs = [
  ["programs","Programs"],
  ["events","Events"],
  ["gallery","Gallery"],
  ["documents","Documents"],
  ["donors","Donors"],
  ["volunteers","Volunteers"],
  ["internships","Student Internships"],
  ["members","Members"],
  ["contactMessages","Messages"],
  ["newsletter","Newsletter"]
];


/* =========================================================
   API FUNCTION
   ========================================================= */

async function api(path,opt={}){

  const isFormData =
    typeof FormData !== "undefined" &&
    opt.body instanceof FormData;

  opt.headers = {
    ...(isFormData ? {} : {"Content-Type":"application/json"}),
    ...(opt.headers || {})
  };

  if(token){
    opt.headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(API + path,opt);

  const text = await response.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }
  catch{
    data = {error:text};
  }

  if(!response.ok){
    throw new Error(data.error || "HTTP " + response.status);
  }

  return data;
}


/* =========================================================
   ESCAPE
   ========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];
    });

}


/* =========================================================
   LOGIN
   ========================================================= */

function login(){

  app.innerHTML = `

    <div class="wrap">

      <div class="card"
           style="max-width:420px;margin:80px auto">

        <h2>🌿 Nisha Seva Foundation</h2>

        <p>
          <b>Admin Panel Login</b>
        </p>

        <input
          id="user"
          placeholder="Username"
        >

        <br><br>

        <input
          id="pass"
          type="password"
          placeholder="Password"
        >

        <br><br>

        <button
          class="primary"
          onclick="doLogin()"
        >
          Login
        </button>

        <div id="msg"></div>

      </div>

    </div>

  `;
}


/* =========================================================
   DO LOGIN
   ========================================================= */

async function doLogin(){

  try{

    const data = await api(
      "/api/admin/login",
      {
        method:"POST",
        body:JSON.stringify({
          username:user.value,
          password:pass.value
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "nisha_token",
      token
    );

    render();

  }
  catch(error){

    msg.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  try{
    await api(
      "/api/admin/logout",
      {
        method:"POST"
      }
    );
  }
  catch{}

  localStorage.removeItem("nisha_token");

  token = "";

  login();

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

async function render(){

  if(!token){
    login();
    return;
  }

  app.innerHTML = `

    <header>

      <div>
        <b>🌿 Nisha Seva Foundation</b>
        <br>
        <small>Admin Panel</small>
      </div>

      <button
        class="muted"
        onclick="logout()"
      >
        Logout
      </button>

    </header>

    <div class="wrap">

      <div class="tabs">

        ${tabs.map(tab => `

          <button
            class="${tab[0] === current ? "active" : ""}"
            onclick="current='${tab[0]}';render()"
          >
            ${tab[1]}
          </button>

        `).join("")}

      </div>

      <div
        class="card"
        id="content"
      >
        Loading...
      </div>

    </div>

  `;


  try{

    if(current === "volunteers"){

      await renderVolunteers();

      return;

    }

    if(current === "internships"){

      await renderInternships();

      return;

    }


    const data = await api(
      "/api/" + current
    );

    const records =
      Array.isArray(data)
        ? data
        : [];


    let html = `

      <div class="row">

        <div>

          <h2>
            ${esc(
              tabs.find(x => x[0] === current)[1]
            )}
          </h2>

          <span class="small">
            ${records.length} record(s)
          </span>

        </div>

        ${
          [
            "programs",
            "events",
            "gallery",
            "documents",
            "donors"
          ].includes(current)
          ?
          `<button
             class="primary"
             onclick="current === 'gallery' ? galleryEditor() : editor()"
           >
             + Add
           </button>`
          :
          ""
        }

      </div>

    `;


    if(records.length){

      html += records
        .map(card)
        .join("");

    }
    else{

      html += `
        <p>
          No records yet.
        </p>
      `;

    }


    content.innerHTML = html;

  }
  catch(error){

    content.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   NORMAL CARD
   ========================================================= */

function card(x){

  if(current === "gallery"){
    const title=x.title||x.caption||x.name||("Gallery #"+x.id);
    const image=x.image||x.imageUrl||x.url||x.photo||"";
    return `
      <div class="item"><div class="row">
        <div style="display:flex;gap:14px;align-items:center;">
          ${image?`<img src="${esc(image)}" alt="${esc(title)}" style="width:110px;height:80px;object-fit:cover;border-radius:10px;border:1px solid #ddd">`:`<div style="width:110px;height:80px;border-radius:10px;background:#eef2f7;display:grid;place-items:center">📷</div>`}
          <div><b>${esc(title)}</b><div class="small">ID: ${esc(x.id)}</div></div>
        </div>
        <div class="actions"><button class="muted" onclick='galleryEditor(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button><button class="danger" onclick="del(${x.id})">Delete</button></div>
      </div>
      ${x.description?`<p style="margin:12px 0 0;">${esc(x.description)}</p>`:""}</div>`;
  }


  const title =
    x.title ||
    x.name ||
    x.subject ||
    x.email ||
    ("Record #" + x.id);


  return `

    <div class="item">

      <div class="row">

        <b>
          ${esc(title)}
        </b>

        <div class="actions">

          <button
            class="muted"
            onclick='editor(${JSON.stringify(x).replace(/'/g,"&#39;")})'
          >
            Edit
          </button>

          <button
            class="danger"
            onclick="del(${x.id})"
          >
            Delete
          </button>

        </div>

      </div>

      <div class="small">
        ID: ${esc(x.id)}
      </div>

      <pre>${esc(JSON.stringify(x,null,2))}</pre>

    </div>

  `;

}


/* =========================================================
   GALLERY PHOTO EDITOR
   ========================================================= */
function galleryEditor(x){
  x=x||{title:'',description:'',image:''};
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal" id="modal"><div class="modalbox">
      <h2>📷 Gallery Photo</h2><div class="small" style="margin-bottom:12px">Photo सीधे server storage में upload होगी; database में केवल image URL save होगा।</div>
      <label><b>Photo</b></label>
      <input type="file" id="galleryPhoto" accept="image/jpeg,image/png,image/webp" style="margin:8px 0 14px" onchange="previewGalleryPhoto(this)">
      <div id="galleryPhotoPreview" style="margin:8px 0 16px;text-align:center">
        ${(x.image||x.imageUrl||x.photo)?`<img src="${esc(x.image||x.imageUrl||x.photo)}" style="max-width:100%;max-height:280px;border-radius:12px;border:1px solid #ddd;object-fit:contain">`:`<div class="small">Photo preview यहाँ दिखाई देगा</div>`}
      </div>
      <label><b>Title</b></label>
      <input id="galleryTitle" value="${esc(x.title||x.caption||x.name||'')}" placeholder="Gallery photo title">
      <br><br>
      <label><b>Description</b></label>
      <textarea id="galleryDescription" rows="5" placeholder="Photo description">${esc(x.description||'')}</textarea>
      <input type="hidden" id="galleryExistingImage" value="${esc(x.image||x.imageUrl||x.photo||'')}">
      <div id="em"></div><br>
      <div class="row"><button class="muted" onclick="modal.remove()">Cancel</button><button class="primary" onclick="saveGallery(${x.id===undefined?'null':x.id})">💾 Save Gallery</button></div>
    </div></div>`);
}
function previewGalleryPhoto(input){
  const file=input.files&&input.files[0]; if(!file)return;
  if(file.size>6*1024*1024){alert('Photo 6MB से कम रखें।');input.value='';return;}
  const reader=new FileReader(); reader.onload=e=>{const box=document.getElementById('galleryPhotoPreview');if(box)box.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:280px;border-radius:12px;border:1px solid #ddd;object-fit:contain">`;}; reader.readAsDataURL(file);
}
async function saveGallery(id){

  try{

    const title =
      document.getElementById("galleryTitle").value.trim();

    const description =
      document.getElementById("galleryDescription").value.trim();

    const input =
      document.getElementById("galleryPhoto");

    const existing =
      document.getElementById("galleryExistingImage").value || "";

    if(!title){
      throw new Error("Gallery title डालें।");
    }

    let image = existing;

    /* -----------------------------------------
       NEW PHOTO -> REAL FILE UPLOAD
       Image is uploaded to Supabase Storage
       through /api/upload.
       ----------------------------------------- */

    if(input && input.files && input.files[0]){

      const file = input.files[0];

      if(file.size > 5 * 1024 * 1024){
        throw new Error("Photo 5MB से कम रखें।");
      }

      if(!file.type.startsWith("image/")){
        throw new Error("केवल image file upload करें।");
      }

      const formData = new FormData();

      formData.append("file",file);

      const uploadResult =
        await api("/api/upload",{
          method:"POST",
          body:formData
        });

      if(!uploadResult || !uploadResult.url){
        throw new Error("Image URL नहीं मिली।");
      }

      image = uploadResult.url;
    }

    if(!image){
      throw new Error("Gallery photo चुनें।");
    }

    /* -----------------------------------------
       Only URL is saved in gallery database.
       Base64 is NOT saved anymore.
       ----------------------------------------- */

    await api(
      id === null
        ? "/api/gallery"
        : "/api/gallery/" + id,
      {
        method:
          id === null
            ? "POST"
            : "PUT",

        body:JSON.stringify({
          title:title,
          description:description,
          image:image
        })
      }
    );

    modal.remove();

    await render();

  }
  catch(error){

    const box =
      document.getElementById("em");

    if(box){
      box.innerHTML =
        `<div class="err">${esc(error.message)}</div>`;
    }
    else{
      alert(error.message);
    }

  }

}

/* =========================================================
   NORMAL EDITOR
   ========================================================= */

function editor(x){

  x = x || {
    title:"",
    description:""
  };


  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>Record</h2>

        <textarea
          id="json"
          rows="18"
        >${esc(JSON.stringify(x,null,2))}</textarea>

        <div id="em"></div>

        <br>

        <div class="row">

          <button
            class="muted"
            onclick="modal.remove()"
          >
            Cancel
          </button>

          <button
            class="primary"
            onclick="save(${x.id === undefined ? "null" : x.id})"
          >
            Save
          </button>

        </div>

      </div>

    </div>

    `
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function save(id){

  try{

    const obj =
      JSON.parse(json.value);

    delete obj.id;

    await api(

      id === null
        ? "/api/" + current
        : "/api/" + current + "/" + id,

      {
        method:
          id === null
            ? "POST"
            : "PUT",

        body:JSON.stringify(obj)
      }

    );

  }

      `<div class="err">${esc(error.message)}</div>`;

/* =========================================================
   DELETE
   ========================================================= */

async function del(id){

  if(!confirm("Delete this record?")){
    return;
  }

  try{

    await api(
      "/api/" + current + "/" + id,
      {
        method:"DELETE"
      }
    );

    render();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   STUDENT INTERNSHIPS
   ========================================================= */
let internshipCache={};
async function renderInternships(){
 content.innerHTML='<h2>Student Internship Applications</h2><p>Loading internship applications...</p>';
 try{const data=await api('/api/internships');const rows=Array.isArray(data)?data:[];internshipCache={};rows.forEach(x=>internshipCache[x.id]=x);let html=`<div class="row"><div><h2>BA Internship Applications</h2><span class="small">${rows.length} application(s)</span></div></div>`;html+=rows.length?rows.map(internshipCard).join(''):'<div class="ok">अभी कोई Student Internship application नहीं है।</div>';content.innerHTML=html;}catch(e){content.innerHTML=`<div class="err">${esc(e.message)}</div>`;}}
function internshipCard(x){
 const status=String(x.status||'pending').toLowerCase(),cls=['pending','active','rejected','revoked'].includes(status)?status:'pending';let actions='';
 if(status==='pending')actions=`<button class="success" onclick="approveInternship(${x.id})">✓ Approve & Issue Offer Letter</button><button class="danger" onclick="rejectInternship(${x.id})">✕ Reject</button>`;
 else if(status==='active')actions=`<button class="primary" onclick="showOfferLetterById(${x.id})">📄 Offer Letter</button><button class="warning" onclick="revokeInternship(${x.id})">Revoke Approval</button>`;
 else actions=`<button class="success" onclick="approveInternship(${x.id})">✓ Approve & Issue Offer Letter</button>`;
 const interests=Array.isArray(x.interests)?x.interests.join(', '):(x.interests||'-');

async function approveInternship(id){if(!confirm('क्या आप इस BA Internship application को Approve करके Official Internship ID और Offer Letter जारी करना चाहते हैं?'))return;try{const result=await api('/api/internships/'+id+'/approve',{method:'POST'});let list=await api('/api/internships');list=Array.isArray(list)?list:[];let item=list.find(x=>Number(x.id)===Number(id));if(!item&&result&&result.id)item=result;if(!item)throw new Error('Approved internship record backend से नहीं मिला।');if(!item.internshipId)item.internshipId=result?.internshipId||('NSF-INT-'+new Date().getFullYear()+'-'+String(id).padStart(4,'0'));if(!item.status||item.status==='pending')item.status='active';internshipCache[id]=item;alert('Internship application approved. अब Premium Offer Letter तैयार है।');showOfferLetter(item);renderInternships();}catch(e){alert('Approval नहीं हो सकी:\n\n'+e.message);}}
async function rejectInternship(id){if(!confirm('क्या आप इस Internship application को Reject करना चाहते हैं?'))return;try{await api('/api/internships/'+id+'/reject',{method:'POST'});alert('Internship application rejected.');renderInternships();}catch(e){alert(e.message);}}
async function revokeInternship(id){if(!confirm('क्या आप इस Internship approval को Revoke करना चाहते हैं?'))return;try{await api('/api/internships/'+id+'/revoke',{method:'POST'});alert('Internship approval revoked.');renderInternships();}catch(e){alert(e.message);}}
function showOfferLetterById(id){const x=internshipCache[id];if(!x){alert('Internship record नहीं मिला। कृपया list refresh करें।');return;}showOfferLetter(x);}
function offerLetterHtml(x){const iid=x.internshipId||('NSF-INT-'+new Date().getFullYear()+'-'+String(x.id||0).padStart(4,'0')),student=x.studentName||x.name||'Student',college=x.collegeName||x.educationCollege||'College',date=x.approvedAt?new Date(x.approvedAt).toLocaleDateString('en-IN'):(x.applicationDate||new Date().toLocaleDateString('en-IN')),interests=Array.isArray(x.interests)?x.interests.join(', '):(x.interests||'Social service and educational activities');return `<div class="offer-preview" id="offerPrintable"><div class="offer-top"><h1>NISHA SEVA FOUNDATION</h1><h2>Student Internship Programme</h2><div style="font-size:12px;color:#555">Internship ID: <b>${esc(iid)}</b> &nbsp; | &nbsp; Date: <b>${esc(date)}</b></div></div><div class="offer-title">INTERNSHIP OFFER LETTER</div><p>Dear <b>${esc(student)}</b>,</p><p>We are pleased to offer you an internship opportunity with <b>Nisha Seva Foundation</b> under the <b>BA Internship Program</b>, subject to the terms and guidelines of the Foundation.</p><p><b>College:</b> ${esc(college)}<br><b>University:</b> ${esc(x.university||'-')}<br><b>Programme:</b> ${esc(x.className||'BA')} · ${esc(x.yearSemester||'-')}<br><b>Internship Duration:</b> ${esc(x.duration||'-')}<br><b>Preferred Area:</b> ${esc(x.preferredPlace||'-')}<br><b>Focus Areas:</b> ${esc(interests)}</p><p>During the internship, you are expected to maintain discipline, confidentiality, punctuality and professional conduct, and to responsibly complete the activities assigned by the Foundation or its coordinator.</p><p>This offer letter is issued on the basis of the information submitted in your Internship Registration Form and the approval recorded by the Foundation.</p><p>We welcome your participation and wish you a meaningful and productive internship experience.</p><div class="offer-sign"><div><b>Authorized Signatory</b><br>Nisha Seva Foundation<br><span style="font-size:12px">Official Internship Programme</span></div><div><b>Student</b><br>${esc(student)}<br><span style="font-size:12px">Internship ID: ${esc(iid)}</span></div></div></div>`;}
function showOfferLetter(x){const old=document.getElementById('offerModal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="offerModal"><div class="modalbox" style="max-width:920px"><div class="row"><div><h2>🎓 Premium Internship Offer Letter</h2><div class="small">${esc(x.studentName||x.name||'Student')} · ${esc(x.internshipId||'')}</div></div><button class="muted" onclick="offerModal.remove()">✕ Close</button></div>${offerLetterHtml(x)}<div class="row"><button class="primary" onclick="downloadOfferLetterPDF()">📄 Download Exact Format Premium PDF</button><button class="muted" onclick="window.print()">🖨 Print</button></div></div></div>`);window.currentInternshipOffer=x;}

  const iid=escLocal(x.internshipId||('NSF-INT-'+new Date().getFullYear()+'-'+String(x.id||0).padStart(4,'0')));
  const student=escLocal(x.studentName||x.name||'');
  const classCourse=escLocal([x.className||'BA',x.program,x.yearSemester].filter(Boolean).join(' / '));
  const roll=escLocal(x.enrollmentRoll||'');
  const college=escLocal(x.collegeName||x.educationCollege||'');
  const address=escLocal(x.address||'');
  const duration=escLocal(x.duration||'');
  const applicationDate=escLocal(x.applicationDate||'');
  const approvedDate=x.approvedAt?new Date(x.approvedAt):null;
  const date=approvedDate&&!isNaN(approvedDate)?approvedDate.toLocaleDateString('en-IN'):applicationDate||new Date().toLocaleDateString('en-IN');
  const coordinator=escLocal(x.coordinatorName||'');
  const interests=Array.isArray(x.interests)?x.interests.join(', '):escLocal(x.interests||'');
  const recommendation=escLocal(x.recommendation||'');

  // Template-specific derived values. Existing application fields are used first;
  // no existing student data is overwritten.
  let startDate=applicationDate;
  let endDate='';
  if(applicationDate && duration){
    const base=new Date(applicationDate);
    const m=duration.match(/(\d+(?:\.\d+)?)\s*(month|months|माह|महीने)/i);
    const w=duration.match(/(\d+(?:\.\d+)?)\s*(week|weeks|सप्ताह)/i);
    const d=duration.match(/(\d+(?:\.\d+)?)\s*(day|days|दिन)/i);
    if(!isNaN(base)){
      const end=new Date(base);
      if(m) end.setMonth(end.getMonth()+Number(m[1]));
      else if(w) end.setDate(end.getDate()+Math.round(Number(w[1])*7));
      else if(d) end.setDate(end.getDate()+Math.round(Number(d[1])));
      if(m||w||d) endDate=end.toLocaleDateString('en-IN');
    }
  }
  const modeText=(()=>{
    const s=(escLocal(x.preferredPlace)+' '+escLocal(x.studentNote)+' '+escLocal(x.availability)).toLowerCase();
    if(s.includes('hybrid'))return 'Hybrid';
    if(s.includes('online'))return 'Online';
    if(s.includes('offline'))return 'Offline';
    return 'Offline';
  })();
  const mentorName=coordinator||'Internship Coordinator';
  const mentorDesignation='College Coordinator';
  const mentorContact=escLocal(x.mobile||x.phone||'7568660017');
  const mentorEmail=escLocal(x.email||'nishasevafoundation@gmail.com');
  const role1=interests||'Internship activities as per selected area of interest';
  const role2=recommendation||'Maintain discipline, confidentiality and timely completion of assigned internship work';

  const {PDFDocument,rgb,StandardFonts}=window.PDFLib;
  (async()=>{
    try{
      const raw=atob(NSF_OFFER_TEMPLATE_BASE64);
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const pdfDoc=await PDFDocument.load(bytes);
      const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
      const bold=await pdfDoc.embedFont(StandardFonts.HelveticaBold);
      const pages=pdfDoc.getPages();
      const blue=rgb(0.06,0.20,0.34);
      const gold=rgb(0.72,0.50,0.10);
      const black=rgb(0.05,0.05,0.05);

      function fitSize(text,maxWidth,maxSize=22,minSize=11,f=font){
        let size=maxSize;
        while(size>minSize && f.widthOfTextAtSize(String(text||''),size)>maxWidth)size-=0.5;
        return size;
      }
      function text(page,text,x,top,maxWidth,maxSize=19,minSize=10,f=font,color=blue){
        const s=String(text||'').trim(); if(!s)return;
        const size=fitSize(s,maxWidth,maxSize,minSize,f);
        page.drawText(s,{x,y:1800-top-size,size,font:f,color});
      }
      function wrap(page,text0,x,top,maxWidth,maxSize=17,minSize=9,f=font,color=black,lineGap=5,maxLines=3){
        let s=String(text0||'').trim();if(!s)return;
        let size=fitSize(s,maxWidth,maxSize,minSize,f);
        const words=s.split(/\s+/),lines=[];let line='';
        for(const w of words){const test=line?line+' '+w:w;if(f.widthOfTextAtSize(test,size)<=maxWidth)line=test;else{if(line)lines.push(line);line=w;}}
        if(line)lines.push(line);
        const use=lines.slice(0,maxLines); const y0=1800-top-size;
        use.forEach((ln,i)=>page.drawText(ln,{x,y:y0-i*(size+lineGap),size,font:f,color}));
      }
      function checkbox(page,label,x,top,checked){
        page.drawRectangle({x,y:1800-top-15,width:13,height:13,borderColor:black,borderWidth:1});
        if(checked)page.drawText('✓',{x:x+1,y:1800-top-14,size:13,font:bold,color:blue});
        page.drawText(label,{x:x+19,y:1800-top-14,size:17,font:bold,color:black});
      }

      // PAGE 1 — exact uploaded template, values only over the blank fields.
      const p1=pages[0];
      text(p1,iid,515,557,350,19,10,bold,blue);
      text(p1,date,1010,557,330,19,10,bold,blue);
      text(p1,student,555,674,410,19,10,bold,blue);
      text(p1,classCourse,555,730,410,18,9,bold,blue);
      text(p1,roll,555,787,410,18,9,bold,blue);
      wrap(p1,college,555,842,410,18,9,bold,blue,3,2);
      wrap(p1,address,555,900,410,17,9,font,black,4,3);
      text(p1,duration,705,1328,270,18,9,bold,blue);
      if(startDate||endDate){
        text(p1,startDate||'—',705,1436,145,16,9,bold,blue);
        text(p1,endDate||'—',1005,1436,140,16,9,bold,blue);
      }
      checkbox(p1,'Online',690,1505,modeText==='Online');
      checkbox(p1,'Offline',815,1505,modeText==='Offline');
      checkbox(p1,'Hybrid',955,1505,modeText==='Hybrid');

      // PAGE 2 — mentor / responsibilities / verification.
      const p2=pages[1];
      text(p2,mentorName,715,126,290,17,9,bold,blue);
      text(p2,mentorDesignation,715,201,290,17,9,bold,blue);
      text(p2,mentorContact,715,275,290,17,9,bold,blue);
      text(p2,mentorEmail,715,349,290,16,8,font,blue);
      wrap(p2,role1,120,475,1050,16,9,font,black,4,2);
      wrap(p2,role2,120,515,1050,16,9,font,black,4,2);

      // QR code is generated from the student's unique Internship ID and basic verification data.
      try{
        const qrHolder=document.createElement('div');
        qrHolder.style.position='fixed';qrHolder.style.left='-10000px';qrHolder.style.top='-10000px';
        document.body.appendChild(qrHolder);
        new QRCode(qrHolder,{text:'Nisha Seva Foundation | Internship ID: '+iid+' | Student: '+student, width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
        await new Promise(r=>setTimeout(r,120));
        const canvas=qrHolder.querySelector('canvas');
        if(canvas){
          const png=await pdfDoc.embedPng(canvas.toDataURL('image/png'));
          p2.drawImage(png,{x:205,y:280,width:230,height:230});
        }
        qrHolder.remove();
      }catch(qe){console.warn('QR generation skipped:',qe);}

      // Premium but template-faithful finishing touches: very subtle gold line inside the blank signature area.
      p2.drawLine({start:{x:710,y:850},end:{x:1135,y:850},thickness:0.5,color:gold,opacity:0.45});
      const out=await pdfDoc.save();
      const blob=new Blob([out],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='Nisha-Seva-Internship-Offer-Letter-'+(student||iid).replace(/[^a-z0-9_-]+/gi,'_')+'.pdf';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }catch(err){console.error(err);alert('Offer Letter PDF generate नहीं हो सकी: '+err.message);}
  })();
}

   ========================================================= */

async function approveVolunteer(id){

  if(!confirm("क्या आप इस volunteer को Approve करके Official ID जारी करना चाहते हैं?")){
    return;
  }

  try{

    const result = await api(
      "/api/volunteers/" + id + "/approve",
      {
        method:"POST"
      }
    );

    /*
      Backend से जो data आएगा उसे existing volunteer
      data के साथ merge किया जाएगा।
    */

    const volunteers = await api("/api/volunteers");

    const list = Array.isArray(volunteers)
      ? volunteers
      : [];

    let volunteer = list.find(
      v => Number(v.id) === Number(id)
    );

    /*
      अगर backend से volunteer वापस नहीं मिला,
      तो result का इस्तेमाल करेंगे।
    */

    /*
      Official ID, status और verification data
      केवल backend से आएगा।
      Admin panel अब कोई official ID
      खुद generate नहीं करता।
    */

    if(!volunteer){
      throw new Error(
        "Approved volunteer record backend से नहीं मिला।"
      );
    }

    if(!volunteer.volunteerId){
      throw new Error(
        "Backend ने official Volunteer ID जारी नहीं की।"
      );
    }


    /*
      ID Card तुरंत खोलें
    */

    showIdCard(volunteer);

    /*
      पीछे volunteer list भी refresh होगी
    */

    setTimeout(function(){

      renderVolunteers();

    },500);

  }
  catch(error){

    alert(
      "ID जारी नहीं हो सकी:\n\n" +
      error.message
    );

  }

}

let currentVolunteer = null;

function drawIdCard(v){

  currentVolunteer = v;

  const canvas = document.getElementById("idCanvas");
  if(!canvas){
    alert("ID Card canvas नहीं मिला।");
    return;
  }

  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  /* ========================= DATA ========================= */
  const volunteerName = String(v.name || v.fullName || "Volunteer");
  const fatherName = String(v.fatherName || v.father || v.vFatherName || "-");
  const gender = String(v.gender || v.vGender || "-");
  const age = String(v.age || v.vAge || "-");
  const city = String(v.city || v.vCity || "-");
  const phone = String(v.phone || v.vPhone || "-");
  const email = String(v.email || v.vEmail || "-");
  const area = String(v.area || v.vArea || "-");
  const volunteerId = String(v.volunteerId || ("NSF-V-" + String(v.id || "").padStart(5,"0")));
  const verificationCode = String(v.verificationCode || "");
  const verificationUrl = v.verificationUrl || (verificationCode ? API + "/verify/volunteer/" + encodeURIComponent(verificationCode) : "");
  const photoUrl = v.photoUrl || v.photo || v.imageUrl || "";

  function roundedRect(x,y,w,h,r,fill,stroke,strokeWidth=1){
    ctx.beginPath();
    if(typeof ctx.roundRect === "function") ctx.roundRect(x,y,w,h,r);
    else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); }
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=strokeWidth;ctx.stroke();}
  }

  function fitText(text,maxChars){
    text=String(text || "-");
    return text.length>maxChars ? text.slice(0,maxChars-1)+"…" : text;
  }

  function drawFlower(cx,cy,scale=1){
    ctx.save(); ctx.translate(cx,cy); ctx.globalAlpha=.28;
    for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.fillStyle="#d9a441"; ctx.beginPath(); ctx.ellipse(0,-18*scale,8*scale,18*scale,0,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle="#b46b8c"; ctx.beginPath(); ctx.arc(0,0,7*scale,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function drawLeaf(x,y,angle,scale=1){
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.globalAlpha=.20; ctx.fillStyle="#0f5132"; ctx.beginPath(); ctx.ellipse(0,0,7*scale,18*scale,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function drawFloralCorner(x,y,flipX,flipY){
    ctx.save(); ctx.translate(x,y); ctx.scale(flipX,flipY);
    drawLeaf(10,45,-.6,1.2); drawLeaf(35,20,-1.0,1); drawLeaf(65,8,-.4,.85); drawFlower(72,60,1); drawFlower(35,85,.65);
    ctx.restore();
  }

  function drawLabelValue(label,value,x,y,max=24){
    ctx.fillStyle="#718096"; ctx.font="bold 13px Arial"; ctx.fillText(label.toUpperCase(),x,y);
    ctx.fillStyle="#172033"; ctx.font="bold 19px Arial"; ctx.fillText(fitText(value,max),x,y+23);
  }

  /* ========================= PREMIUM BACKGROUND ========================= */
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#0b4d35"); bg.addColorStop(.5,"#146b49"); bg.addColorStop(1,"#0b3b2a");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawFloralCorner(18,18,1,1); drawFloralCorner(W-18,18,-1,1); drawFloralCorner(18,H-18,1,-1); drawFloralCorner(W-18,H-18,-1,-1);
  roundedRect(22,22,W-44,H-44,34,"#f8f3e7","#d9a441",5);
  roundedRect(38,38,W-76,H-76,26,"#fffdf8","#ead7a6",2);

  /* ========================= HEADER ========================= */
  roundedRect(38,38,W-76,112,26,"#0f5132",null);
  ctx.fillStyle="#f7e6b5"; ctx.font="bold 34px Georgia, serif"; ctx.fillText("NISHA SEVA FOUNDATION",78,88);
  ctx.fillStyle="#f7d889"; ctx.font="bold 15px Arial"; ctx.fillText("OFFICIAL VOLUNTEER IDENTITY CARD",80,119);
  ctx.fillStyle="#d9a441"; ctx.beginPath(); ctx.arc(W-92,94,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#0f5132"; ctx.font="bold 21px Arial"; ctx.fillText("NSF",W-112,101);

  /* ========================= PHOTO ========================= */
  const photoX=72, photoY=185, photoW=225, photoH=275;
  roundedRect(photoX-5,photoY-5,photoW+10,photoH+10,22,"#d9a441",null);
  roundedRect(photoX,photoY,photoW,photoH,18,"#e9eef6",null);

  function drawInitial(){
    roundedRect(photoX,photoY,photoW,photoH,18,"#e9eef6",null);
    ctx.fillStyle="#0f5132"; ctx.font="bold 100px Georgia, serif";
    ctx.fillText((volunteerName.charAt(0)||"V").toUpperCase(),photoX+82,photoY+170);
    ctx.fillStyle="#718096"; ctx.font="bold 14px Arial"; ctx.fillText("PHOTO",photoX+87,photoY+220);
  }

  function drawPhoto(img){
    ctx.save(); ctx.beginPath();
    if(typeof ctx.roundRect === "function") ctx.roundRect(photoX,photoY,photoW,photoH,18); else ctx.rect(photoX,photoY,photoW,photoH);
    ctx.clip();
    const scale=Math.max(photoW/img.width,photoH/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    ctx.drawImage(img,photoX+(photoW-dw)/2,photoY+(photoH-dh)/2,dw,dh);
    ctx.restore();
  }

  /* ========================= DETAILS ========================= */
  ctx.fillStyle="#8b6a20"; ctx.font="bold 14px Arial"; ctx.fillText("VOLUNTEER",335,187);
  ctx.fillStyle="#172033"; ctx.font="bold 31px Georgia, serif"; ctx.fillText(fitText(volunteerName,27),335,222);

  function finishQR(qrSource){
    if(qrSource){
      ctx.drawImage(qrSource,qrX,qrY,qrSize,qrSize);
    }else{
      ctx.fillStyle="#f8d7da";
      ctx.fillRect(qrX,qrY,qrSize,qrSize);
      ctx.fillStyle="#842029";
      ctx.font="bold 16px Arial";
      ctx.textAlign="center";
      ctx.fillText("QR unavailable",qrX+qrSize/2,qrY+112);
      ctx.textAlign="left";
    }

    ctx.fillStyle="#0f5132";
    ctx.font="bold 16px Arial";
    ctx.textAlign="center";
    ctx.fillText("SCAN TO VERIFY",qrX+qrSize/2,qrY+qrSize+48);

    ctx.fillStyle="#718096";
    ctx.font="13px Arial";
    ctx.fillText(verificationCode || "Verification",qrX+qrSize/2,qrY+qrSize+70);
    ctx.textAlign="left";

    /* ========================= BOTTOM DETAILS ========================= */
    roundedRect(72,530,750,86,18,"#f6f1e5","#ead7a6",1.5);
    drawLabelValue("Phone",phone,95,548,18);
    drawLabelValue("Area",area,310,548,22);
    drawLabelValue("Gender",gender,565,548,14);

    drawPremiumFooter();

    /* restore volunteer photo after the card has been composed */
    if(photoUrl){
      const photo=new Image();
      photo.onload=function(){drawPhoto(photo);};
      photo.onerror=function(){drawInitial();};
      photo.src=photoUrl;
    }else{
      drawInitial();
    }
  }

  if(verificationUrl){
    const qrHost=document.createElement("div");
    qrHost.style.position="fixed";
    qrHost.style.left="-10000px";
    qrHost.style.top="-10000px";
    qrHost.style.width=qrSize+"px";
    qrHost.style.height=qrSize+"px";
    document.body.appendChild(qrHost);

    try{
      new QRCode(qrHost,{
        text:verificationUrl,
        width:qrSize,
        height:qrSize,
        correctLevel:QRCode.CorrectLevel.H
      });

      setTimeout(function(){
        const source=qrHost.querySelector("img") || qrHost.querySelector("canvas");
        if(source){
          if(source.tagName==="IMG"){
            if(source.complete){
              finishQR(source);
              qrHost.remove();
            }else{
              source.onload=function(){
                finishQR(source);
                qrHost.remove();
              };
              source.onerror=function(){
                finishQR(null);
                qrHost.remove();
              };
            }
          }else{
            finishQR(source);
            qrHost.remove();
          }
        }else{
          finishQR(null);
          qrHost.remove();
        }
      },120);
    }catch(e){
      finishQR(null);
      qrHost.remove();
    }
  }else{
    finishQR(null);
  }

  /* ========================= VOLUNTEER PHOTO ========================= */
  if(photoUrl){
    const photo=new Image();
    photo.onload=function(){drawPhoto(photo);};
    photo.onerror=function(){drawInitial();};
    photo.src=photoUrl;
  }else drawInitial();
}

/* =========================================================
   DOWNLOAD PDF
   ========================================================= */

function downloadPDF(){

  if(!currentVolunteer){
    return;
  }


  const canvas =
    document.getElementById(
      "idCanvas"
    );


  const image =
    canvas.toDataURL(
      "image/png"
    );


  const { jsPDF } =
    window.jspdf;


  const pdf =
    new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4"
    });


  const pageWidth =
    pdf.internal.pageSize.getWidth();


  const pageHeight =
    pdf.internal.pageSize.getHeight();


  const margin = 15;

  const maxWidth =
    pageWidth - margin*2;

  const maxHeight =
    pageHeight - margin*2;


  const ratio =
    canvas.width /
    canvas.height;


  let width =
    maxWidth;

  let height =
    width / ratio;


  if(height > maxHeight){

    height =
      maxHeight;

    width =
      height * ratio;

  }


  const x =
    (pageWidth-width)/2;

  const y =
    (pageHeight-height)/2;


  pdf.addImage(
    image,
    "PNG",
    x,
    y,
    width,
    height
  );


  const name =
    (
      currentVolunteer.name ||
      currentVolunteer.fullName ||
      "volunteer"
    )
    .replace(/[^a-z0-9]/gi,"_");


  pdf.save(
    "Nisha-Seva-Volunteer-ID-" +
    name +
    ".pdf"
  );

}

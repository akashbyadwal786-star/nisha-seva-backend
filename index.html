<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nisha Seva Foundation - Admin Panel</title>

<!-- QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#123b6d;
  color:white;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.wrap{
  max-width:1150px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #0001;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tabs button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#e9eef6;
}

.tabs button.active{
  background:#123b6d;
  color:white;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:600;
}

.primary{
  background:#1769e0;
  color:white;
}

.success{
  background:#198754;
  color:white;
}

.danger{
  background:#d9363e;
  color:white;
}

.warning{
  background:#f0ad00;
  color:#111;
}

.muted{
  background:#e9eef6;
  color:#172033;
}

.item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  background:#fff;
}

.row{
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd4df;
  border-radius:8px;
  box-sizing:border-box;
}

textarea{
  resize:vertical;
}

.small{
  color:#687386;
  font-size:13px;
}

.err{
  background:#ffe8e8;
  color:#9b1c1c;
  padding:11px;
  border-radius:8px;
  margin:10px 0;
}

.ok{
  background:#e8f7ed;
  color:#146c2e;
  padding:11px;
  border-radius:8px;
  margin:10px 0;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.status.pending{
  background:#fff3cd;
  color:#856404;
}

.status.active{
  background:#d1e7dd;
  color:#0f5132;
}

.status.rejected{
  background:#f8d7da;
  color:#842029;
}

.status.revoked{
  background:#e2e3e5;
  color:#41464b;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#f7f8fa;
  padding:12px;
  border-radius:8px;
  font-size:12px;
  overflow:auto;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
  overflow:auto;
}

.modalbox{
  background:white;
  max-width:850px;
  width:100%;
  padding:22px;
  border-radius:16px;
  max-height:95vh;
  overflow:auto;
}

.id-preview{
  display:flex;
  justify-content:center;
  margin:20px 0;
}

#idCanvas{
  width:700px;
  max-width:100%;
  border-radius:16px;
  box-shadow:0 8px 30px #0003;
}

.volunteer-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.info-box{
  background:#f7f9fc;
  border-radius:8px;
  padding:10px;
}

.info-box strong{
  display:block;
  font-size:12px;
  color:#687386;
  margin-bottom:4px;
}

@media(max-width:650px){
  .volunteer-info{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   API
   ========================================================= */

const API = location.origin;

let token = localStorage.getItem("nisha_token") || "";
let current = "programs";
let volunteerCache = {};


/* =========================================================
   TABS
   ========================================================= */

const tabs = [
  ["programs","Programs"],
  ["events","Events"],
  ["gallery","Gallery"],
  ["documents","Documents"],
  ["donors","Donors"],
  ["volunteers","Volunteers"],
  ["members","Members"],
  ["contactMessages","Messages"],
  ["newsletter","Newsletter"]
];


/* =========================================================
   API FUNCTION
   ========================================================= */

async function api(path,opt={}){

  opt.headers = {
    "Content-Type":"application/json",
    ...(opt.headers || {})
  };

  if(token){
    opt.headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(API + path,opt);

  const text = await response.text();

  let data = {};

  try{
    data = text ? JSON.parse(text) : {};
  }
  catch{
    data = {error:text};
  }

  if(!response.ok){
    throw new Error(data.error || "HTTP " + response.status);
  }

  return data;
}


/* =========================================================
   ESCAPE
   ========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];
    });

}


/* =========================================================
   LOGIN
   ========================================================= */

function login(){

  app.innerHTML = `

    <div class="wrap">

      <div class="card"
           style="max-width:420px;margin:80px auto">

        <h2>🌿 Nisha Seva Foundation</h2>

        <p>
          <b>Admin Panel Login</b>
        </p>

        <input
          id="user"
          placeholder="Username"
        >

        <br><br>

        <input
          id="pass"
          type="password"
          placeholder="Password"
        >

        <br><br>

        <button
          class="primary"
          onclick="doLogin()"
        >
          Login
        </button>

        <div id="msg"></div>

      </div>

    </div>

  `;
}


/* =========================================================
   DO LOGIN
   ========================================================= */

async function doLogin(){

  try{

    const data = await api(
      "/api/admin/login",
      {
        method:"POST",
        body:JSON.stringify({
          username:user.value,
          password:pass.value
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "nisha_token",
      token
    );

    render();

  }
  catch(error){

    msg.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  try{
    await api(
      "/api/admin/logout",
      {
        method:"POST"
      }
    );
  }
  catch{}

  localStorage.removeItem("nisha_token");

  token = "";

  login();

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

async function render(){

  if(!token){
    login();
    return;
  }

  app.innerHTML = `

    <header>

      <div>
        <b>🌿 Nisha Seva Foundation</b>
        <br>
        <small>Admin Panel</small>
      </div>

      <button
        class="muted"
        onclick="logout()"
      >
        Logout
      </button>

    </header>

    <div class="wrap">

      <div class="tabs">

        ${tabs.map(tab => `

          <button
            class="${tab[0] === current ? "active" : ""}"
            onclick="current='${tab[0]}';render()"
          >
            ${tab[1]}
          </button>

        `).join("")}

      </div>

      <div
        class="card"
        id="content"
      >
        Loading...
      </div>

    </div>

  `;


  try{

    if(current === "volunteers"){

      await renderVolunteers();

      return;

    }


    const data = await api(
      "/api/" + current
    );

    const records =
      Array.isArray(data)
        ? data
        : [];


    let html = `

      <div class="row">

        <div>

          <h2>
            ${esc(
              tabs.find(x => x[0] === current)[1]
            )}
          </h2>

          <span class="small">
            ${records.length} record(s)
          </span>

        </div>

        ${
          [
            "programs",
            "events",
            "gallery",
            "documents",
            "donors"
          ].includes(current)
          ?
          `<button
             class="primary"
             onclick="current === 'gallery' ? galleryEditor() : editor()"
           >
             + Add
           </button>`
          :
          ""
        }

      </div>

    `;


    if(records.length){

      html += records
        .map(card)
        .join("");

    }
    else{

      html += `
        <p>
          No records yet.
        </p>
      `;

    }


    content.innerHTML = html;

  }
  catch(error){

    content.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   NORMAL CARD
   ========================================================= */

function card(x){

  if(current === "gallery"){
    const title=x.title||x.caption||x.name||("Gallery #"+x.id);
    const image=x.image||x.imageUrl||x.url||x.photo||"";
    return `
      <div class="item"><div class="row">
        <div style="display:flex;gap:14px;align-items:center;">
          ${image?`<img src="${esc(image)}" alt="${esc(title)}" style="width:110px;height:80px;object-fit:cover;border-radius:10px;border:1px solid #ddd">`:`<div style="width:110px;height:80px;border-radius:10px;background:#eef2f7;display:grid;place-items:center">📷</div>`}
          <div><b>${esc(title)}</b><div class="small">ID: ${esc(x.id)}</div></div>
        </div>
        <div class="actions"><button class="muted" onclick='galleryEditor(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button><button class="danger" onclick="del(${x.id})">Delete</button></div>
      </div>
      ${x.description?`<p style="margin:12px 0 0;">${esc(x.description)}</p>`:""}</div>`;
  }


  const title =
    x.title ||
    x.name ||
    x.subject ||
    x.email ||
    ("Record #" + x.id);


  return `

    <div class="item">

      <div class="row">

        <b>
          ${esc(title)}
        </b>

        <div class="actions">

          <button
            class="muted"
            onclick='editor(${JSON.stringify(x).replace(/'/g,"&#39;")})'
          >
            Edit
          </button>

          <button
            class="danger"
            onclick="del(${x.id})"
          >
            Delete
          </button>

        </div>

      </div>

      <div class="small">
        ID: ${esc(x.id)}
      </div>

      <pre>${esc(JSON.stringify(x,null,2))}</pre>

    </div>

  `;

}


/* =========================================================
   GALLERY PHOTO EDITOR
   ========================================================= */
function galleryEditor(x){
  x=x||{title:'',description:'',image:''};
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal" id="modal"><div class="modalbox">
      <h2>📷 Gallery Photo</h2>
      <label><b>Photo</b></label>
      <input type="file" id="galleryPhoto" accept="image/jpeg,image/png,image/webp" style="margin:8px 0 14px" onchange="previewGalleryPhoto(this)">
      <div id="galleryPhotoPreview" style="margin:8px 0 16px;text-align:center">
        ${(x.image||x.imageUrl||x.photo)?`<img src="${esc(x.image||x.imageUrl||x.photo)}" style="max-width:100%;max-height:280px;border-radius:12px;border:1px solid #ddd;object-fit:contain">`:`<div class="small">Photo preview यहाँ दिखाई देगा</div>`}
      </div>
      <label><b>Title</b></label>
      <input id="galleryTitle" value="${esc(x.title||x.caption||x.name||'')}" placeholder="Gallery photo title">
      <br><br>
      <label><b>Description</b></label>
      <textarea id="galleryDescription" rows="5" placeholder="Photo description">${esc(x.description||'')}</textarea>
      <input type="hidden" id="galleryExistingImage" value="${esc(x.image||x.imageUrl||x.photo||'')}">
      <div id="em"></div><br>
      <div class="row"><button class="muted" onclick="modal.remove()">Cancel</button><button class="primary" onclick="saveGallery(${x.id===undefined?'null':x.id})">💾 Save Gallery</button></div>
    </div></div>`);
}
function previewGalleryPhoto(input){
  const file=input.files&&input.files[0]; if(!file)return;
  if(file.size>6*1024*1024){alert('Photo 6MB से कम रखें।');input.value='';return;}
  const reader=new FileReader(); reader.onload=e=>{const box=document.getElementById('galleryPhotoPreview');if(box)box.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:280px;border-radius:12px;border:1px solid #ddd;object-fit:contain">`;}; reader.readAsDataURL(file);
}
async function saveGallery(id){
  try{
    const title=document.getElementById('galleryTitle').value.trim();
    const description=document.getElementById('galleryDescription').value.trim();
    const input=document.getElementById('galleryPhoto'); const existing=document.getElementById('galleryExistingImage').value||'';
    if(!title)throw new Error('Gallery title डालें।');
    let image=existing;
    if(input&&input.files&&input.files[0]){
      const file=input.files[0]; if(file.size>6*1024*1024)throw new Error('Photo 6MB से कम रखें।');
      image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Photo read नहीं हो सकी।'));r.readAsDataURL(file);});
    }
    if(!image)throw new Error('Gallery photo चुनें।');
    await api(id===null?'/api/gallery':'/api/gallery/'+id,{method:id===null?'POST':'PUT',body:JSON.stringify({title,description,image})});
    modal.remove(); render();
  }catch(error){const box=document.getElementById('em');if(box)box.innerHTML=`<div class="err">${esc(error.message)}</div>`;else alert(error.message);}
}

/* =========================================================
   NORMAL EDITOR
   ========================================================= */

function editor(x){

  x = x || {
    title:"",
    description:""
  };


  document.body.insertAdjacentHTML(
    "beforeend",

    `

    <div
      class="modal"
      id="modal"
    >

      <div class="modalbox">

        <h2>Record</h2>

        <textarea
          id="json"
          rows="18"
        >${esc(JSON.stringify(x,null,2))}</textarea>

        <div id="em"></div>

        <br>

        <div class="row">

          <button
            class="muted"
            onclick="modal.remove()"
          >
            Cancel
          </button>

          <button
            class="primary"
            onclick="save(${x.id === undefined ? "null" : x.id})"
          >
            Save
          </button>

        </div>

      </div>

    </div>

    `
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function save(id){

  try{

    const obj =
      JSON.parse(json.value);

    delete obj.id;

    await api(

      id === null
        ? "/api/" + current
        : "/api/" + current + "/" + id,

      {
        method:
          id === null
            ? "POST"
            : "PUT",

        body:JSON.stringify(obj)
      }

    );

    modal.remove();

    render();

  }
  catch(error){

    em.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   DELETE
   ========================================================= */

async function del(id){

  if(!confirm("Delete this record?")){
    return;
  }

  try{

    await api(
      "/api/" + current + "/" + id,
      {
        method:"DELETE"
      }
    );

    render();

  }
  catch(error){

    alert(error.message);

  }

}


/* =========================================================
   VOLUNTEERS
   ========================================================= */

async function renderVolunteers(){

  content.innerHTML = `
    <h2>Volunteers</h2>
    <p>Loading volunteers...</p>
  `;


  try{

    const data =
      await api("/api/volunteers");

    const volunteers =
      Array.isArray(data)
        ? data
        : [];

    volunteerCache = {};
    volunteers.forEach(v => { volunteerCache[v.id] = v; });


    let html = `

      <div class="row">

        <div>

          <h2>Volunteer Applications</h2>

          <span class="small">
            ${volunteers.length} volunteer(s)
          </span>

        </div>

      </div>

    `;


    if(!volunteers.length){

      html += `
        <div class="ok">
          अभी कोई volunteer application नहीं है।
        </div>
      `;

    }
    else{

      html += volunteers
        .map(volunteerCard)
        .join("");

    }


    content.innerHTML = html;

  }
  catch(error){

    content.innerHTML =
      `<div class="err">${esc(error.message)}</div>`;

  }

}


/* =========================================================
   VOLUNTEER CARD
   ========================================================= */

function volunteerCard(v){

  const status =
    String(v.status || "pending").toLowerCase();


  const statusClass =
    ["pending","active","rejected","revoked"]
      .includes(status)
      ? status
      : "pending";


  let actions = "";


  if(status === "pending"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Approve & Issue ID
      </button>

      <button
        class="danger"
        onclick="rejectVolunteer(${v.id})"
      >
        ✕ Reject
      </button>

    `;

  }


 if(status === "active"){

  actions = `

    <button
      class="primary"
      onclick="showIdCardById(${v.id})"
    >
      🪪 ID Card
    </button>

    <button
      class="muted"
      onclick="openVerification('${esc(v.verificationCode || "")}','${esc(v.verificationUrl || "")}')"
    >
      🔍 Verify
    </button>

    <button
      class="warning"
      onclick="revokeVolunteer(${v.id})"
    >
      Revoke ID
    </button>

  `;

}

  if(status === "rejected"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Approve & Issue ID
      </button>

    `;

  }


  if(status === "revoked"){

    actions = `

      <button
        class="success"
        onclick="approveVolunteer(${v.id})"
      >
        ✓ Re-issue ID
      </button>

    `;

  }


  return `

    <div class="item">

      <div class="row">

        <div>

          <h3 style="margin:0 0 6px">
            ${esc(
              v.name ||
              v.fullName ||
              "Volunteer"
            )}
          </h3>

          <span
            class="status ${statusClass}"
          >
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="actions">
          ${actions}
        </div>

      </div>


      ${
        v.photoUrl
          ? `<div style="margin-top:12px;display:flex;align-items:center;gap:12px">
               <img src="${esc(v.photoUrl)}" alt="Volunteer Photo" style="width:78px;height:96px;object-fit:cover;border-radius:10px;border:2px solid #d9a441;background:#f7f9fc">
               <div class="small"><b>Volunteer Photo</b><br>Photo received with application.</div>
             </div>`
          : ""
      }

      <div class="volunteer-info">

        <div class="info-box">
          <strong>Volunteer ID</strong>
          ${esc(v.volunteerId || "Not issued")}
        </div>

        <div class="info-box">
          <strong>Database ID</strong>
          ${esc(v.id)}
        </div>

        <div class="info-box">
          <strong>Phone</strong>
          ${esc(v.phone || "-")}
        </div>

        <div class="info-box">
          <strong>Email</strong>
          ${esc(v.email || "-")}
        </div>

        <div class="info-box">
          <strong>Father's Name</strong>
          ${esc(v.fatherName || v.father || "-")}
        </div>

        <div class="info-box">
          <strong>Gender</strong>
          ${esc(v.gender || "-")}
        </div>

        <div class="info-box">
          <strong>City</strong>
          ${esc(v.city || "-")}
        </div>

        <div class="info-box">
          <strong>Area</strong>
          ${esc(v.area || "-")}
        </div>

        <div class="info-box">
          <strong>Skills</strong>
          ${esc(v.skills || "-")}
        </div>

        <div class="info-box">
          <strong>Submitted</strong>
          ${esc(
            v.submittedAt
              ? new Date(v.submittedAt).toLocaleString()
              : "-"
          )}
        </div>

      </div>


      ${
        v.message
        ?
        `<div style="margin-top:12px">
           <b>Message:</b>
           ${esc(v.message)}
         </div>`
        :
        ""
      }


      ${
        v.verificationCode
        ?
        `<div class="small" style="margin-top:10px">
           Verification Code:
           <b>${esc(v.verificationCode)}</b>
         </div>`
        :
        ""
      }

    </div>

  `;

}


/* =========================================================
   APPROVE
   ========================================================= */

async function approveVolunteer(id){

  if(!confirm("क्या आप इस volunteer को Approve करके Official ID जारी करना चाहते हैं?")){
    return;
  }

  try{

    const result = await api(
      "/api/volunteers/" + id + "/approve",
      {
        method:"POST"
      }
    );

    /*
      Backend से जो data आएगा उसे existing volunteer
      data के साथ merge किया जाएगा।
    */

    const volunteers = await api("/api/volunteers");

    const list = Array.isArray(volunteers)
      ? volunteers
      : [];

    let volunteer = list.find(
      v => Number(v.id) === Number(id)
    );

    /*
      अगर backend से volunteer वापस नहीं मिला,
      तो result का इस्तेमाल करेंगे।
    */

    if(!volunteer){

      volunteer = {
        id:id,
        ...(result || {})
      };

    }

    /*
      सुनिश्चित करें कि status ACTIVE रहे
    */

    volunteer.status = "active";

    /*
      अगर backend ने Volunteer ID नहीं भेजी,
      तो database ID से official ID बनाएंगे।
    */

    if(!volunteer.volunteerId){

      volunteer.volunteerId =
        "NSF-V-" +
        String(id).padStart(5,"0");

    }

    /*
      Verification code backend से आना चाहिए।
    */

    if(result && result.verificationCode){
      volunteer.verificationCode = result.verificationCode;
    }

    if(result && result.verificationUrl){
      volunteer.verificationUrl = result.verificationUrl;
    }


    /*
      ID Card तुरंत खोलें
    */

    showIdCard(volunteer);

    /*
      पीछे volunteer list भी refresh होगी
    */

    setTimeout(function(){

      renderVolunteers();

    },500);

  }
  catch(error){

    alert(
      "ID जारी नहीं हो सकी:\n\n" +
      error.message
    );

  }

}
/* =========================================================
   REJECT
   ========================================================= */

async function rejectVolunteer(id){

  if(
    !confirm(
      "क्या आप इस volunteer application को Reject करना चाहते हैं?"
    )
  ){
    return;
  }


  try{

    await api(
      "/api/volunteers/" + id + "/reject",
      {
        method:"POST"
      }
    );


    alert(
      "Volunteer application rejected."
    );


    renderVolunteers();

  }
  catch(error){

    alert(error.message);

  }

}

let currentVolunteer = null;

function drawIdCard(v){

  currentVolunteer = v;

  const canvas = document.getElementById("idCanvas");
  if(!canvas){
    alert("ID Card canvas नहीं मिला।");
    return;
  }

  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  /* ========================= DATA ========================= */
  const volunteerName = String(v.name || v.fullName || "Volunteer");
  const fatherName = String(v.fatherName || v.father || v.vFatherName || "-");
  const gender = String(v.gender || v.vGender || "-");
  const age = String(v.age || v.vAge || "-");
  const city = String(v.city || v.vCity || "-");
  const phone = String(v.phone || v.vPhone || "-");
  const email = String(v.email || v.vEmail || "-");
  const area = String(v.area || v.vArea || "-");
  const volunteerId = String(v.volunteerId || ("NSF-V-" + String(v.id || "").padStart(5,"0")));
  const verificationCode = String(v.verificationCode || "");

  const photoUrl = v.photoUrl || v.photo || v.imageUrl || "";

    ctx.beginPath();

    if(fill){ctx.fillStyle=fill;ctx.fill();}

  function fitText(text,maxChars){
    text=String(text || "-");

    ctx.fillStyle="#b46b8c"; ctx.beginPath(); ctx.arc(0,0,7*scale,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  function drawLeaf(x,y,angle,scale=1){
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.globalAlpha=.20; ctx.fillStyle="#0f5132"; ctx.beginPath(); ctx.ellipse(0,0,7*scale,18*scale,0,0,Math.PI*2); ctx.fill(); ctx.restore();

  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  function finishQR(qrSource){
    if(qrSource){
      ctx.drawImage(qrSource,qrX,qrY,qrSize,qrSize);
    }else{
      ctx.fillStyle="#f8d7da";
      ctx.fillRect(qrX,qrY,qrSize,qrSize);
      ctx.fillStyle="#842029";
      ctx.font="bold 16px Arial";
      ctx.textAlign="center";
      ctx.fillText("QR unavailable",qrX+qrSize/2,qrY+112);
      ctx.textAlign="left";
    }

    ctx.fillStyle="#0f5132";
    ctx.font="bold 16px Arial";
    ctx.textAlign="center";
    ctx.fillText("SCAN TO VERIFY",qrX+qrSize/2,qrY+qrSize+48);

    ctx.fillStyle="#718096";
    ctx.font="13px Arial";
    ctx.fillText(verificationCode || "Verification",qrX+qrSize/2,qrY+qrSize+70);
    ctx.textAlign="left";

    /* ========================= BOTTOM DETAILS ========================= */
    roundedRect(72,530,750,86,18,"#f6f1e5","#ead7a6",1.5);
    drawLabelValue("Phone",phone,95,548,18);
    drawLabelValue("Area",area,310,548,22);
    drawLabelValue("Gender",gender,565,548,14);

    drawPremiumFooter();

    /* restore volunteer photo after the card has been composed */
    if(photoUrl){
      const photo=new Image();
      photo.onload=function(){drawPhoto(photo);};
      photo.onerror=function(){drawInitial();};
      photo.src=photoUrl;
    }else{
      drawInitial();
    }
  }

  /* ========================= GENERATE QR ========================= */
  if(verificationUrl){
    const qrHost=document.createElement("div");
    qrHost.style.position="fixed";
    qrHost.style.left="-10000px";
    qrHost.style.top="-10000px";
    qrHost.style.width=qrSize+"px";
    qrHost.style.height=qrSize+"px";
    document.body.appendChild(qrHost);

    try{
      new QRCode(qrHost,{
        text:verificationUrl,
        width:qrSize,
        height:qrSize,
        correctLevel:QRCode.CorrectLevel.H
      });

      setTimeout(function(){
        const source=qrHost.querySelector("img") || qrHost.querySelector("canvas");
        if(source){
          if(source.tagName==="IMG"){
            if(source.complete){
              finishQR(source);
              qrHost.remove();
            }else{
              source.onload=function(){
                finishQR(source);
                qrHost.remove();
              };
              source.onerror=function(){
                finishQR(null);
                qrHost.remove();
              };
            }
          }else{
            finishQR(source);
            qrHost.remove();
          }
        }else{
          finishQR(null);
          qrHost.remove();
        }
      },120);
    }catch(e){
      finishQR(null);
      qrHost.remove();
    }
  }else{
    finishQR(null);
  }

  /* ========================= VOLUNTEER PHOTO ========================= */
  if(photoUrl){
    const photo=new Image();
    photo.onload=function(){drawPhoto(photo);};
    photo.onerror=function(){drawInitial();};
    photo.src=photoUrl;
  }else drawInitial();
}


/* =========================================================
   DOWNLOAD PNG
   ========================================================= */

function downloadPNG(){

  if(!currentVolunteer){
    return;
  }


  const canvas =
    document.getElementById(
      "idCanvas"
    );


  const name =
    (
      currentVolunteer.name ||
      currentVolunteer.fullName ||
      "volunteer"
    )
    .replace(/[^a-z0-9]/gi,"_");


  const link =
    document.createElement("a");


  link.download =
    "Nisha-Seva-Volunteer-ID-" +
    name +
    ".png";


  link.href =
    canvas.toDataURL("image/png");


  link.click();

}


/* =========================================================
   DOWNLOAD PDF
   ========================================================= */

function downloadPDF(){

  if(!currentVolunteer){
    return;
  }


  const canvas =
    document.getElementById(
      "idCanvas"
    );


  const image =
    canvas.toDataURL(
      "image/png"
    );


  const { jsPDF } =
    window.jspdf;


  const pdf =
    new jsPDF({
      orientation:"landscape",
      unit:"mm",
      format:"a4"
    });


  const pageWidth =
    pdf.internal.pageSize.getWidth();


  const pageHeight =
    pdf.internal.pageSize.getHeight();


  const margin = 15;

  const maxWidth =
    pageWidth - margin*2;

  const maxHeight =
    pageHeight - margin*2;


  const ratio =
    canvas.width /
    canvas.height;


  let width =
    maxWidth;

  let height =
    width / ratio;


  if(height > maxHeight){

    height =
      maxHeight;

    width =
      height * ratio;

  }


  const x =
    (pageWidth-width)/2;

  const y =
    (pageHeight-height)/2;


  pdf.addImage(
    image,
    "PNG",
    x,
    y,
    width,
    height
  );


  const name =
    (
      currentVolunteer.name ||
      currentVolunteer.fullName ||
      "volunteer"
    )
    .replace(/[^a-z0-9]/gi,"_");


  pdf.save(
    "Nisha-Seva-Volunteer-ID-" +
    name +
    ".pdf"
  );

}


/* =========================================================
   OPEN VERIFICATION
   ========================================================= */

function openVerification(code,url){

  const target =
    url ||
    (code
      ? API + "/verify/volunteer/" + encodeURIComponent(code)
      : "");

  if(!target){
    alert("Verification link available नहीं है।");
    return;
  }

  window.open(target,"_blank","noopener,noreferrer");
}

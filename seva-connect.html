<!DOCTYPE html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SevaConnect | NSF</title><style>body{font-family:system-ui;background:#f1f7f3;color:#17382b;margin:0;padding:20px}.wrap{max-width:850px;margin:auto}section{background:white;padding:22px;border-radius:16px;margin:16px 0;box-shadow:0 5px 20px #0001}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccd8d0;border-radius:8px}button{background:#137c52;color:white;padding:12px 18px;border:0;border-radius:9px;font-weight:700}h1{color:#11643e}.muted{color:#52675d}</style><div class="wrap"><h1>🤝 SevaConnect — Nisha Seva Foundation</h1><p class="muted">सहायता की आवश्यकता और स्वयंसेवक सेवा को जोड़ने का मंच। संवेदनशील विवरण केवल आवश्यक सीमा तक दें।</p><section><h2>मुझे सहायता चाहिए</h2><form id="help"><input name="name" placeholder="नाम" required><input name="mobile" placeholder="मोबाइल" required><input name="district" placeholder="जिला" required><input name="village" placeholder="गांव"><select name="category"><option>Education</option><option>Medical</option><option>Food</option><option>Clothing</option><option>Employment</option><option>Emergency</option><option>Other</option></select><textarea name="details" placeholder="सहायता का विवरण (कम से कम 10 अक्षर)" required></textarea><button>Request Help</button></form><p id="hmsg"></p></section><section><h2>मैं स्वयंसेवक बनना चाहता/चाहती हूँ</h2><form id="vol"><input name="name" placeholder="नाम" required><input name="mobile" placeholder="मोबाइल" required><input name="district" placeholder="जिला" required><input name="skills" placeholder="कौशल/सहायता क्षेत्र"><input name="availability" placeholder="उपलब्ध समय"><button>Register Volunteer</button></form><p id="vmsg"></p></section><section><h2>Request Status Overview</h2><div id="stats">Loading...</div></section><p><a href="/">NSF Home</a> · <a href="/jansamadhan">JanSamadhan</a> · <a href="/gramvikas">GramVikas</a></p></div><script>async function submit(f,url,out){f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));try{let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();document.getElementById(out).textContent=r.ok?(j.request?'Request ID: '+j.request.code+' | Status: '+j.request.status:(j.message||'Submitted successfully')):(j.error||'Error');f.reset()}catch{document.getElementById(out).textContent='Network error'}}}submit(document.getElementById('help'),'/api/sevaconnect/request','hmsg');submit(document.getElementById('vol'),'/api/sevaconnect/volunteer','vmsg');fetch('/api/sevaconnect/stats').then(r=>r.json()).then(d=>document.getElementById('stats').textContent=(d.stats||[]).map(x=>x.status+': '+x.n).join(' | ')||'No requests yet').catch(()=>document.getElementById('stats').textContent='Unavailable');</script></html>

name: NSF implementation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/coordinator-impact-passport]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and reconcile lockfile in CI workspace
        run: npm ci --ignore-scripts
      - name: Check backend syntax
        run: node --check server.js
      - name: Check inline JavaScript in portal files
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile, sys
          files = ["admin/index.html", "student-portal.html"]
          failed = False
          for name in files:
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"SKIP: {name} not found")
                  continue
              source = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>", source, re.I)
              inline = [script for script in scripts if script.strip()]
              for index, script in enumerate(inline, 1):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as tmp:
                      tmp.write(script)
                      temp_name = tmp.name
                  result = subprocess.run(["node", "--check", temp_name], text=True, capture_output=True)
                  pathlib.Path(temp_name).unlink(missing_ok=True)
                  if result.returncode:
                      failed = True
                      print(f"FAIL: {name} inline script #{index}")
                      print(result.stderr)
                  else:
                      print(f"PASS: {name} inline script #{index}")
          sys.exit(1 if failed else 0)
          PY
